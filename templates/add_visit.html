{% extends "base.html" %}
{% block title %}Add Visit — MySmartMed{% endblock %}
{% block content %}
<div class="page-header"><h1>Record Doctor Visit</h1></div>
<div class="card">
    {% if not doctors %}
    <p class="empty-state">No doctors added yet.
        <a href="{{ url_for('add_doctor', patient_id=patient_id) }}">Add a doctor first</a>.</p>
    {% else %}
    <form method="POST" class="stacked">
        <label for="doctor_id">Doctor</label>
        <select id="doctor_id" name="doctor_id" required>
            {% for d in doctors %}
            <option value="{{ d.doctor_id }}">{{ d.name }}</option>
            {% endfor %}
        </select>

        <div class="form-row">
            <div>
                <label for="visit_date">Visit Date</label>
                <input type="date" id="visit_date" name="visit_date" required>
            </div>
            <div>
                <label for="next_visit_date">Next Visit Date</label>
                <input type="date" id="next_visit_date" name="next_visit_date">
            </div>
        </div>

        <label for="notes">Notes</label>
        <textarea id="notes" name="notes" placeholder="Diagnosis, instructions, follow-up notes..."></textarea>

        <div class="btn-row">
            <button type="submit" class="btn btn-primary">Save Visit</button>
            <a href="{{ url_for('patient_detail', patient_id=patient_id) }}" class="btn btn-outline">Cancel</a>
        </div>
    </form>
    {% endif %}
</div>
{% endblock %}
