{% extends "base.html" %}
{% block title %}Add Doctor — MySmartMed{% endblock %}
{% block content %}
<div class="page-header"><h1>Add Doctor</h1></div>
<div class="card">
    <form method="POST" class="stacked">
        <input type="hidden" name="return_to"
               value="{{ url_for('patient_detail', patient_id=patient_id) if patient_id else url_for('dashboard') }}">

        <label for="name">Doctor Name</label>
        <input type="text" id="name" name="name" required>

        <div class="form-row">
            <div>
                <label for="hospital">Hospital / Clinic</label>
                <input type="text" id="hospital" name="hospital">
            </div>
            <div>
                <label for="specialisation">Specialisation</label>
                <input type="text" id="specialisation" name="specialisation">
            </div>
        </div>

        <label for="contact_number">Contact Number</label>
        <input type="text" id="contact_number" name="contact_number">

        <div class="btn-row">
            <button type="submit" class="btn btn-primary">Save Doctor</button>
            <a href="{{ url_for('patient_detail', patient_id=patient_id) if patient_id else url_for('dashboard') }}"
               class="btn btn-outline">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
